<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">
    <title>Pagamento de Fatura com PIX</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/personalizado.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/pix-pagamento-fatura.css">
</head>
<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="pix-pagamento-fatura" class="page page-scrollable">
                <!-- Header -->
                <div class="navbar-fixed flex items-center px-4 pb-2 bg-white" style="padding-top: 40px;">
                    <a href="#" onclick="app.views.main.router.navigate('/')" class="back w-12 h-12 flex items-center justify-center text-gray-600 rounded-full bg-gray-50 back-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M15 6l-6 6l6 6" />
                        </svg>
                    </a>
                </div>

                <!-- Page content -->
                <div class="page-content bg-white">
                    <div class="px-4 py-6">
                        <!-- QR Code -->
                        <div class="text-center mb-6">
                            <div class="flex justify-center">
                                <div class="p-1 rounded-xl" style="width: 200px; height: 200px;">
                                    <div class="bg-white p-1 rounded-xl w-full h-full">
                                        <div id="qrcodeFaturaPix" class="flex items-center justify-center w-full h-full">
                                            <!-- QR Code será gerado aqui -->
                                            <div class="text-gray-400 text-sm">Carregando...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    <!-- Informações da Fatura -->
                    <div class="px-4 mt-4">
                        <div class="text-center mb-4">
                            <div class="text-gray-800 text-sm font-medium mb-2">Valor da Fatura</div>
                            <div class="text-gray-800 text-3xl font-bold" id="valorFaturaPix">
                                <span class="font-bold text-gray-800" style="font-size: 28px;">R$&nbsp;</span>
                                <span style="font-size: 28px;">0,00</span>
                            </div>
                        </div>

                        <div class="text-center mb-6">
                            <div class="text-gray-800 text-sm font-medium mb-2">Data de Vencimento</div>
                            <div class="text-gray-800 text-lg" id="dataVencimentoPix">
                                --/--/----
                            </div>
                        </div>
                    </div>

                    <!-- Título e texto do Código PIX -->
                    <div class="px-4 mt-4">
                        <div class="text-center mb-4">
                            <div class="text-gray-800 text-lg font-semibold">Código PIX para Pagamento</div>
                            <div class="text-gray-600 text-sm mt-2">
                                Copie o código abaixo e cole no seu aplicativo bancário
                            </div>
                            <div class="text-gray-600 text-sm">
                                ou utilize o QR Code para pagamento
                            </div>
                        </div>
                    </div>

                    <!-- Campo de Código PIX -->
                    <div class="px-4 mt-4">
                        <div class="flex items-center justify-center mb-4">
                            <div class="bg-white rounded-lg p-3" style="width: 90%; border: 2px dashed #cbd5e1; position: relative; min-height: 3.5rem;">
                                <div style="display: flex; align-items: center; justify-content: space-between;">
                                    <span class="text-gray-700 font-mono text-sm" id="codigoPix" style="word-break: break-all; max-width: 85%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2;">
                                        Carregando...
                                    </span>
                                    <i id="btnCopiarCodigo" class="mdi mdi-content-copy text-lg text-blue-500 hover:text-blue-600 cursor-pointer" style="flex-shrink: 0;"></i>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>

    <script src="lib/framework7-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="js/pix-pagamento-fatura.js"></script>
</body>
</html>
