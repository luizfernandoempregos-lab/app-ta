<!DOCTYPE html>
<html>
<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#1e40af">
    <!-- Your app title -->
    <title>Boleto - Banco Digital</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/personalizado.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bank-blue': '#1e40af',
                        'bank-light': '#3b82f6',
                        'bank-dark': '#1e3a8a'
                    }
                }
            }
        }
    </script>
    <!-- Melhorias visuais -->
    <link rel="stylesheet" href="css/melhorias-visuais.css">
</head>

<body>
    <!-- App root element -->
    <div id="app">
        <div class="view view-main">
            <div data-name="boleto" class="page" style="border-radius: 16px 16px 0 0; overflow: hidden;">
                <!-- Header -->
                <div class="flex items-center justify-between px-4 pb-2" style="padding-top: 40px;">
                    <div class="flex items-center">
                        <a href="#" onclick="app.views.main.router.back()" class="back w-12 h-12 flex items-center justify-center text-gray-600 rounded-full bg-gray-50" style="border:none;outline:none;cursor:pointer;padding:0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 6l-6 6l6 6" /></svg>
                        </a>
                    </div>
                    <div class="text-center">
                        <h1 class="text-lg font-bold text-gray-800">Boleto Bancário</h1>
                    </div>
                    <div class="w-12"></div>
                </div>

                <!-- Page content -->
                <div class="page-content">
                    <div class="px-4 py-6">
                        
                        <!-- Card do Boleto -->
                        <div class="rounded-lg border border-gray-200 p-6 shadow-sm mb-6">
                            <div class="text-center mb-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-2">Dados do Boleto</h2>
                                <p class="text-sm text-gray-600">Copie as informações para pagamento</p>
                            </div>
                            
                            <!-- Código de Barras -->
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Código de Barras</label>
                                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border">
                                    <span class="font-mono text-lg text-gray-800" id="codigoBarras">23793.38128 60000.633935 96000.633935 3 84410026000</span>
                                    <button onclick="copiarCodigoBarras()" class="ml-3 p-2 text-gray-600 hover:text-bank-blue transition-colors" title="Copiar código">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Data de Vencimento -->
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Data de Vencimento</label>
                                <div class="p-3 bg-gray-50 rounded-lg border">
                                    <span class="text-lg text-gray-800" id="dataVencimento">15/12/2024</span>
                                </div>
                            </div>
                            
                            <!-- Valor -->
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Valor Total</label>
                                <div class="p-3 bg-gray-50 rounded-lg border">
                                    <span class="text-2xl font-bold text-gray-800" id="valorBoleto">R$ 1.250,00</span>
                                </div>
                            </div>
                            
                            <!-- Informações Adicionais -->
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                <div class="flex items-start">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 mr-3">
                                        <circle cx="12" cy="12" r="10"/>
                                        <path d="M12 16v-4"/>
                                        <path d="M12 8h.01"/>
                                    </svg>
                                    <div class="text-sm text-blue-800">
                                        <p class="font-medium mb-1">Como pagar:</p>
                                        <p>1. Copie o código de barras</p>
                                        <p>2. Acesse seu banco ou aplicativo de pagamentos</p>
                                        <p>3. Cole o código e confirme o pagamento</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        


                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <!-- Script da página -->
    <script type="text/javascript" src="js/boleto.js"></script>



    <style>
        body {

        
        /* Garantir que a página não tenha rolagem */
        .page {
            height: 100vh;
            overflow: hidden;
        }
        
        .page-content {
            height: calc(100vh - 60px); /* Subtrair altura do header */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* Hover effects */
        .hover\:bg-gray-50:hover {
            background-color: #f9fafb;
        }
        
        .hover\:bg-bank-dark:hover {
            background-color: #1e3a8a;
        }
    </style>
</body>
</html>
