<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="white">
  <title>Chat - Banco Digital</title>
  <link rel="stylesheet" href="lib/framework7-bundle.min.css">
  <link rel="stylesheet" href="css/personalizado.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/materialdesignicons.min.css">
</head>
<body>
  <div id="app">
    <div class="view view-main">
      <div class="page" data-name="chat">

        <!-- Header -->
        <div class="chat-header">
          <a class="chat-back-btn" onclick="if(window.app&&app.views&&app.views.main){app.views.main.router.back();}else{history.back();}" style="outline:none;cursor:pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
          </a>
          <div class="chat-header-avatar" id="chatHeaderAvatar">
            <svg class="chat-avatar-spinner" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chatHeaderName">Conversa</div>
            <div class="chat-header-sub" id="chatHeaderSub"></div>
          </div>
          <div class="chat-header-actions">
            <button class="chat-icon-btn" onclick="abrirLigacao()">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l1.17-1.17a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
            <button class="chat-icon-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <button class="chat-icon-btn" id="closeButton" onclick="fecharAtendimento()" style="display:none;">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3"/><path d="M18 15l3-3"/></svg>
            </button>
          </div>
        </div>

        <div class="page-content" style="padding:0; display:flex; flex-direction:column; height:calc(100% - 57px);">
          <!-- Mensagens -->
          <div class="chat-messages" id="chatMessages"></div>

          <!-- Preview de resposta + Barra inferior -->
          <div class="chat-bottom">
            <div class="chat-reply-preview" id="chatReplyPreview" style="display:none;">
              <div class="chat-reply-preview-bar"></div>
              <div class="chat-reply-preview-content">
                <div class="chat-reply-preview-name" id="chatReplyPreviewName"></div>
                <div class="chat-reply-preview-text" id="chatReplyPreviewText"></div>
              </div>
              <button class="chat-reply-preview-close" onclick="cancelarResposta()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
              </button>
            </div>

            <!-- Barra inferior -->
            <div class="chat-bar">
              <div class="chat-input-wrap">
                <input type="text" id="messageInput" class="chat-input" placeholder="Mensagem..." onkeypress="handleMessageKeypress(event)" oninput="chatInputChanged(this)">
                <button class="chat-bar-btn" id="chatSendBtn" onclick="sendChatMessage(event)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
              <button class="chat-bar-btn chat-bar-camera">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
  <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
  <script type="text/javascript" src="js/routes.js"></script>
  <script type="text/javascript" src="js/user-service.js"></script>
  <script src="cordova.js"></script>
  <script type="text/javascript" src="js/chat.js"></script>
</body>
</html>
