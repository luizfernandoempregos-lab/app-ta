<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Frente do Documento</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/personalizado.css">
    <link rel="stylesheet" href="css/frente-documento.css">
    <!-- Melhorias visuais -->
    <link rel="stylesheet" href="css/melhorias-visuais.css">
</head>
<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="frente-documento" class="page page-scrollable">
                <!-- Header -->
                <div class="flex items-center justify-between px-4 pb-2 fixed top-0 left-0 right-0 z-50" style="padding-top: 40px; background: transparent;">
                    <div class="flex items-center">
                        <a href="#" onclick="app.views.main.router.back()" class="w-12 h-12 flex items-center justify-center text-white" style="border:none;outline:none;cursor:pointer;padding:0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                <path d="M15 6l-6 6l6 6" />
                            </svg>
                        </a>
                    </div>
                </div>

                <!-- Câmera em tela cheia com blur -->
                <div class="frente-documento-camera-container">
                    <!-- Vídeo de fundo com blur -->
                    <video id="frente-documento-camera-video-blur" autoplay playsinline class="frente-documento-video-blur"></video>
                    
                    <!-- Overlay de documento focado -->
                    <div class="frente-documento-documento-overlay">
                        <div class="frente-documento-documento-frame">
                            <div id="frente-documento-camera-preview" class="frente-documento-camera-preview">
                                <video id="frente-documento-camera-video" autoplay playsinline style="display: none;"></video>
                                <canvas id="frente-documento-camera-canvas" style="display: none;"></canvas>
                                <div id="frente-documento-preview-placeholder" class="frente-documento-preview-placeholder">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: #9ca3af;">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                        <path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2" />
                                        <path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                                    </svg>
                                    <p style="color: #6b7280; font-size: 14px; margin-top: 12px; text-align: center;">Clique para iniciar a câmera</p>
                                </div>
                                <img id="frente-documento-photo-preview" src="" alt="Preview da foto" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0;">
                            </div>
                        </div>
                    </div>

                    <!-- Header -->
                    <div class="frente-documento-header">
                        <div class="flex items-center">
                            <a href="#" onclick="app.views.main.router.back()" class="w-12 h-12 flex items-center justify-center text-white" style="border:none;outline:none;cursor:pointer;padding:0;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                    <path d="M15 6l-6 6l6 6" />
                                </svg>
                            </a>
                        </div>
                    </div>

                    <!-- Guia de documento -->
                    <div class="frente-documento-guia">
                        <h1 class="text-xl font-bold text-white mb-1">Frente do Documento</h1>
                        <p class="text-sm text-gray-300">Alinhe dentro do marco</p>
                    </div>

                    <!-- Rodapé com botões de ação -->
                    <div class="frente-documento-footer-acoes">
                        <!-- Círculo para capturar foto (quando câmera está ativa) -->
                        <div id="frente-documento-icon-capturar" class="frente-documento-icon-capturar" style="display: none;">
                        </div>
                        
                        <!-- Botões para repetir e confirmar (quando foto está capturada) -->
                        <div id="frente-documento-icons-acoes" class="frente-documento-icons-acoes" style="display: none;">
                            <button id="frente-documento-icon-repetir" class="frente-documento-icon-acao" style="flex: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; border-radius: 9999px; background-color: transparent; height: 50px; color: #fff; font-weight: 500;">
                                Tentar Novamente
                            </button>
                            <button id="frente-documento-icon-confirmar" class="frente-documento-icon-acao" style="flex: 1; display: flex; align-items: center; justify-content: center; border: none; border-radius: 9999px; background-color: #059669; height: 50px; color: #ffffff; font-weight: 500;">
                                Confirmar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Framework7 Library -->
    <script src="lib/framework7-bundle.min.js"></script>
    <script src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
</body>
</html>
