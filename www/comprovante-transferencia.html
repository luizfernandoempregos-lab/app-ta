<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="white">

    <!-- Your app title -->
    <title>Comprovante</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/personalizado.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>


    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bank-blue': '#1e40af',
                        'bank-light': '#3b82f6',
                        'bank-dark': '#1e3a8a'
                    }
                }
            }
        }
    </script>
    <!-- Melhorias visuais -->
    <link rel="stylesheet" href="css/melhorias-visuais.css">
</head>

<body>
    <!-- App root element -->
    <div id="app">
        <div class="view view-main">

            <div data-name="comprovante-transferencia" class="page page-scrollable">
                <!-- Header Fixo -->
                <div class="navbar px-0 pt-2 pb-0 fixed top-0 left-0 right-0 z-50" style="min-height: 104px; padding-bottom: 28px; position: fixed !important;">
                    <div class="navbar-bg" style=""></div>
                    <div class="navbar-inner flex items-center justify-between px-4 pt-2">
                        <div style="margin-top:40px;"></div>
                        <div class="flex items-center" style="margin-top:24px;">
                            <a href="#" onclick="app.views.main.router.back()" class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                                </svg>
                            </a>
                        </div>
                        <div class="flex-1 text-center">
                            <h1 class="text-lg font-semibold text-gray-900">Comprovante</h1>
                        </div>
                        <div class="flex items-center" style="margin-top:24px;">
                            <button onclick="compartilharComprovante()" class="flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-share">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                    <path d="M6 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                                    <path d="M18 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                                    <path d="M18 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                                    <path d="M8.7 10.7l6.6 -3.4" />
                                    <path d="M8.7 13.3l6.6 3.4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Conteúdo principal com padding-top para compensar o header fixo -->
                <div class="px-4 py-6" style="padding-top: 120px;">
                    <!-- Título principal -->
                    <div class="text-center mb-6">
                        <h1 class="text-xl font-bold text-gray-900 mb-2">Oba! Transferência recebida!</h1>
                        <p class="text-sm text-gray-600" id="comprovanteDataHora">00/00/0000 00:00:00</p>
                    </div>

                    <!-- Linha separadora -->
                    <div class="border-t border-gray-200 mb-6"></div>

                    <!-- Valor -->
                    <div class="text-center mb-6">
                        <p class="text-sm text-gray-500 mb-1">Valor</p>
                        <div id="comprovanteValorTransferencia" class="text-3xl font-bold text-gray-900">
                            <span style="font-size: 16px;">R$</span>
                            <span style="font-size: 28px;">0</span><span style="font-size: 16px;">,00</span>
                        </div>
                    </div>

                    <!-- Linha separadora -->
                    <div class="border-t border-gray-200 mb-6"></div>

                    <!-- Informações do destinatário -->
                    <div class="mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">Informações do destinatário</h2>
                        <div class="space-y-3">
                            <div>
                                <span class="text-sm font-bold text-gray-900">Nome:</span>
                                <div class="mt-1">
                                    <span id="comprovanteNomeDestinatario" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                            <div>
                                <span class="text-sm font-bold text-gray-900">CPF:</span>
                                <div class="mt-1">
                                    <span id="comprovanteCpfDestinatario" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                            <div>
                                <span class="text-sm font-bold text-gray-900">Instituição:</span>
                                <div class="mt-1">
                                    <span id="comprovanteBancoDestinatario" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Linha separadora -->
                    <div class="border-t border-gray-200 mb-6"></div>

                    <!-- Informações do pagador -->
                    <div class="mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">Informações do pagador</h2>
                        <div class="space-y-3">
                            <div>
                                <span class="text-sm font-bold text-gray-900">Nome:</span>
                                <div class="mt-1">
                                    <span id="comprovanteNomeRemetente" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                            <div>
                                <span class="text-sm font-bold text-gray-900">CPF:</span>
                                <div class="mt-1">
                                    <span id="comprovanteCpfRemetente" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                            <div>
                                <span class="text-sm font-bold text-gray-900">Instituição:</span>
                                <div class="mt-1">
                                    <span id="comprovanteBancoRemetente" class="text-base font-light text-gray-900 uppercase"></span>
                                </div>
                            </div>
                            <div>
                                <span class="text-sm font-bold text-gray-900">Tipo de transferência:</span>
                                <div class="mt-1">
                                    <span class="text-base font-light text-gray-900 uppercase">ENTRE CONTAS</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Identificadores da transação -->
                    <div class="mb-6 bg-gray-100 -mx-4 px-4 py-4">
                        <div class="space-y-3">
                            <div>
                                <span class="text-sm font-bold text-gray-900 whitespace-nowrap">ID da Transação:</span>
                                <div class="mt-1 flex items-center">
                                    <span id="comprovanteIdTransacao" class="text-base font-light text-gray-900 uppercase"></span>
                                    <button onclick="copiarCodigoComprovante(event)" class="p-1 rounded-lg transition-colors ml-2" title="Copiar código">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Framework7 Library Bundle JS -->
    <script src="lib/framework7-bundle.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
    <!-- Routes JS -->
    <script src="js/routes.js"></script>
    <!-- User Service -->
    <script src="js/user-service.js"></script>
    <!-- Script específico da página -->
    <script src="js/comprovante-transferencia.js"></script>
</body>

</html>
