<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Informações de Empréstimo</title>
  <link rel="stylesheet" href="lib/framework7-bundle.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/personalizado.css">
  <link rel="stylesheet" href="css/informacoes-emprestimo.css">
  <script src="js/informacoes-emprestimo.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app">
    <div class="view view-main">
      <div class="page page-scrollable" data-name="informacoes-emprestimo">


                <!-- Header -->
                <div class="navbar-fixed flex items-center px-4 pb-2" style="padding-top: 40px;">
                    <a href="#" onclick="app.views.main.router.back()" class="back w-12 h-12 flex items-center justify-center text-gray-600 rounded-full bg-gray-50 back-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M15 6l-6 6l6 6" />
                        </svg>
                    </a>
                </div>

                <!-- Page content -->
                <div class="page-content informacoes-content">
                    <div class="px-4 py-6">
                        <h1 class="text-2xl font-bold mb-6">Empréstimo</h1>

                        <!-- Status do Empréstimo -->
                        <div class="mb-8" id="statusEmprestimoContainer">
                            <div class="card card-strong color-blue" style="margin: 0; padding: 20px 16px 20px 16px; position: relative;">
                                <div id="statusEmprestimoContent">
                                    <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto"></div>
                                    <p class="text-sm text-gray-600 mt-4">Carregando...</p>
                                </div>
                            </div>
                        </div>

                        <!-- Mais informações -->
                        <div class="mb-8">
                            <div class="space-y-2">
                                <div>
                                    <div class="flex items-center justify-between p-4 border-b border-gray-100">
                                        <span class="text-sm text-gray-700">Simular empréstimo</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                                            <path d="M9 18l6-6-6-6"/>
                                        </svg>
                                    </div>
                                    <div class="flex items-center justify-between p-4 border-b border-gray-100 cursor-pointer" onclick="if (window.app && window.app.views && window.app.views.main && window.app.views.main.router) { window.app.views.main.router.navigate('/meus-emprestimos/', { transition: 'f7-push' }); } else { window.location.href = 'meus-emprestimos.html'; }">
                                        <span class="text-sm text-gray-700">Meus empréstimos</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                                            <path d="M9 18l6-6-6-6"/>
                                        </svg>
                                    </div>
                                    <div class="flex items-center justify-between p-4">
                                        <span class="text-sm text-gray-700">Perguntas frequentes</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                                            <path d="M9 18l6-6-6-6"/>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
      </div>
    </div>
  </div>

  <!-- Overlay semi-transparente para loading -->
  <div id="loadingOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 1000000; display: none; text-align: center;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.4);">
      <div style="width: 40px; height: 40px; border: 4px solid #1e40af; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
  </div>

  <style>
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>

  <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
</body>
</html>
