<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alterar Senha - Banco Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/personalizado.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Moranga', sans-serif;
            color: #222;
            min-height: 100vh;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bank-blue': '#1e40af',
                        'bank-light': '#3b82f6',
                        'bank-dark': '#1e3a8a'
                    }
                }
            }
        }
    </script>
    <!-- Melhorias visuais -->
    <link rel="stylesheet" href="css/melhorias-visuais.css">
</head>
<body class="min-h-screen flex flex-col">
    <!-- App root element -->
    <div id="app">
        <div class="view view-main">
            <div class="page min-h-screen flex flex-col" data-name="alterar-senha">
                
                <!-- Botão Voltar -->
                <div class="flex items-center px-4 pb-2 bg-white" style="padding-top: 40px; pb-2 bg-white">
                    <a href="/verificar-codigo-email/" class="w-12 h-12 flex items-center justify-center text-gray-600 rounded-full bg-gray-50" style="border:none;outline:none;cursor:pointer;padding:0;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 6l-6 6l6 6" />
                        </svg>
                    </a>
                </div>

                <!-- Conteúdo Principal -->
                <div class="flex-1 px-6 py-8 bg-white">
                    
                    <!-- Logo/Title -->
                    <div class="text-center mb-8">
                        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <circle cx="12" cy="16" r="1"></circle>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h1 id="tituloAlterarSenha" class="text-2xl font-bold text-gray-800 mb-2">Alterar Senha</h1>
                        <p id="subtituloAlterarSenha" class="text-gray-600">Digite sua nova senha de acesso</p>
                    </div>

                    <!-- Formulário -->
                    <div class="space-y-6">
                        
                        <!-- Nova Senha -->
                        <div class="mb-6">
                            <label id="labelSenhaAlterar" class="block text-sm font-medium text-gray-700 mb-4 text-center">Nova Senha</label>
                            <script>
                                // Definir textos imediatamente para evitar mudança visual
                                document.addEventListener('DOMContentLoaded', function() {
                                    const cpf = sessionStorage.getItem('cpfVerificado') || localStorage.getItem('cpf_usuario');
                                    if (cpf && window.userService) {
                                        window.userService.getUserDataFromDB(cpf).then(usuario => {
                                            if (usuario && (!usuario.senha || usuario.senha.trim() === '')) {
                                                // Usuário não tem senha - é cadastro de senha
                                                const titulo = document.getElementById('tituloAlterarSenha');
                                                const subtitulo = document.getElementById('subtituloAlterarSenha');
                                                const label = document.getElementById('labelSenhaAlterar');
                                                
                                                if (titulo) titulo.textContent = 'Cadastrar Senha';
                                                if (subtitulo) subtitulo.textContent = 'Digite sua senha de acesso';
                                                if (label) label.textContent = 'Senha';
                                            }
                                        }).catch(() => {
                                            // Manter textos padrão em caso de erro
                                        });
                                    }
                                });
                            </script>
                            
                            <!-- Pontinhos círculos -->
                            <div id="circulosContainer" class="flex justify-center items-center space-x-4 mb-4 relative" onclick="console.log('Clique nos círculos detectado'); focarInputSenhaAlterar();" style="cursor: pointer;">
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="0"></div>
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="1"></div>
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="2"></div>
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="3"></div>
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="4"></div>
                                <div class="w-4 h-4 rounded-full bg-gray-100 senha-dot-alterar" data-index="5"></div>
                            </div>
                            
                            <!-- Loading -->
                            <div id="loadingContainer" class="flex justify-center items-center mb-4 hidden">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                            </div>
                            
                            <!-- Sucesso -->
                            <div id="sucessoContainer" class="flex justify-center items-center mb-4 hidden">
                                <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20,6 9,17 4,12"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Mensagens de Erro/Sucesso -->
                        <div id="mensagemErroAlterar" class="text-red-500 text-sm text-center hidden"></div>
                        <div id="mensagemSucessoAlterar" class="text-green-500 text-sm text-center hidden"></div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/alterar-senha.js"></script>
</body>
</html>
