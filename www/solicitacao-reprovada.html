<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação Reprovada</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/personalizado.css">
    <link rel="stylesheet" href="css/tailwind-output.css">
    <link rel="stylesheet" href="fonts/moranga.css">
</head>
<body>
    <div class="page" data-name="solicitacao-reprovada">
        <div class="page-content" style="padding: 0;">
            <!-- Ícone X no topo -->
            <div style="position: absolute; top: 50px; right: 20px; z-index: 10;">
                <a href="#" onclick="app.views.main.router.navigate('/index/')" style="display: block; width: 40px; height: 40px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>
            </div>
            
            <!-- Conteúdo Principal -->
            <div style="margin: 20px; border-radius: 20px; padding-top: 40px;">
                <div class="text-align-center" style="padding: 40px 20px;">
                    <!-- Ícone de Carinha Triste -->
                    <div style="margin-bottom: 30px;">
                        <div style="font-size: 80px; color: #ec4899; margin: 0 auto; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
                            😔
                        </div>
                    </div>

                    <!-- Título Principal -->
                    <h2 style="color: #1f2937; font-size: 24px; font-weight: 600; margin-bottom: 15px; font-family: 'Moranga', serif;">
                        Olá <span id="nome-usuario" style="color: #ef4444; font-weight: 600;"></span>!
                    </h2>
                    
                    <h3 style="color: #1f2937; font-size: 20px; font-weight: 600; margin-bottom: 15px; font-family: 'Moranga', serif;">
                        No momento <strong>não podemos aprovar</strong> seu limite de crédito
                    </h3>

                    <!-- Mensagem Secundária -->
                    <p style="color: #6b7280; font-size: 16px; line-height: 1.6; margin-bottom: 20px;">
                        Não desanime: você pode tentar <strong>de novo</strong> em 30 dias, tá?
                    </p>

                    <!-- Mensagem Final -->
                    <p style="color: #6b7280; font-size: 14px; line-height: 1.5; margin-bottom: 30px;">
                        Nossos critérios de aprovação estão constantemente mudando, esperamos você por aqui novamente!
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="lib/framework7-bundle.min.js"></script>
    <script src="js/solicitacao-reprovada.js"></script>

    <style>
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</body>
</html>
