<!DOCTYPE html>
<html>
<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#1e40af">
    <!-- Your app title -->
    <title>Verificar Código WhatsApp - Banco Digital</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/personalizado.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bank-blue': '#1e40af',
                        'bank-light': '#3b82f6',
                        'bank-dark': '#1e3a8a'
                    }
                }
            }
        }
    </script>
</head>

<body>
    <!-- App root element -->
    <div id="app">
        <div class="view view-main">
            <div data-name="verificar-codigo-whatsapp" class="page" style="border-radius: 16px 16px 0 0; overflow: hidden;">
                <!-- Header -->
                <div class="flex items-center justify-between px-4 pb-2" style="padding-top: 40px;">
                    <div class="flex items-center">
                        <a href="/metodos-verificacao/" class="back w-12 h-12 flex items-center justify-center text-gray-600 rounded-full bg-gray-50" style="border:none;outline:none;cursor:pointer;padding:0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-chevron-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 6l-6 6l6 6" /></svg>
                        </a>
                    </div>
                </div>

                <!-- Page content -->
                <div class="page-content">
                    <!-- Verificar Código Form -->
                    <div class="px-6 py-8">
                        <!-- Logo/Title -->
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-whatsapp">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                    <path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" />
                                    <path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" />
                                </svg>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-800 mb-2">Código enviado!</h1>
                            <p class="text-gray-600">Enviamos um código de 6 dígitos para seu WhatsApp terminado em <span class="font-semibold">8429</span></p>
                        </div>

                        <!-- Timer -->
                        <div class="text-center mb-8">
                            <div class="rounded-2xl p-4 border border-gray-200">
                                <p class="text-sm text-gray-600 mb-2">Código válido por:</p>
                                <div id="timer" class="text-2xl font-bold text-bank-blue">01:00</div>
                                <p id="reenviarText" class="text-sm text-gray-500 mt-2 hidden">Não recebeu o código? <button id="btnReenviar" class="text-bank-blue font-semibold">Reenviar</button></p>
                            </div>
                        </div>

                        <!-- Código Fields -->
                        <div class="mb-8">
                            <div class="text-gray-700 text-sm font-semibold mb-4 text-center">
                                Digite o código de 6 dígitos
                            </div>
                            <div class="flex justify-center space-x-3">
                                <input type="text" id="codigo1" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                                <input type="text" id="codigo2" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                                <input type="text" id="codigo3" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                                <input type="text" id="codigo4" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                                <input type="text" id="codigo5" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                                <input type="text" id="codigo6" maxlength="1" class="w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:outline-none focus:border-bank-blue" inputmode="numeric">
                            </div>
                            <div id="codigoError" class="text-red-500 text-sm mt-2 text-center hidden">Código inválido</div>
                        </div>

                        <!-- Informação adicional -->
                        <div class="text-center mb-8">
                            <p class="text-sm text-gray-600">
                                Verifique se o código foi enviado em sua conversa do WhatsApp
                            </p>
                        </div>
                    </div>

                    <!-- Button Footer -->
                    <div class="fixed bottom-0 left-0 right-0 p-6" style="padding-bottom: 58px;">
                        <button 
                            type="submit" 
                            id="btnConfirmar"
                            class="w-full bg-bank-blue hover:bg-bank-dark text-white font-semibold py-4 px-6 rounded-2xl transition-colors duration-200"
                            style="position: relative; z-index: 10; cursor: pointer;"
                            disabled
                        >
                            <span id="confirmarText" style="pointer-events: none;">Confirmar Código</span>
                            <div id="confirmarLoader" class="hidden flex items-center justify-center" style="pointer-events: none;">
                                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Verificando...
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <!-- Script da Verificação -->
    <script type="text/javascript" src="js/verificar-codigo-whatsapp.js"></script>

    <style>
        body {
        }
        
        /* Garantir que a página não tenha rolagem */
        .page {
            height: 100vh;
            overflow: hidden;
        }
        
        .page-content {
            height: calc(100vh - 60px); /* Subtrair altura do header */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-bottom: 100px; /* Espaço para o botão fixo */
        }
        
        /* Animação para o botão disabled */
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* Garantir que o botão funcione corretamente */
        #btnConfirmar {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        #btnConfirmar:not(:disabled) {
            cursor: pointer;
        }
        
        /* Estilo para inputs de código */
        input[type="text"]::-webkit-outer-spin-button,
        input[type="text"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Animação para campos preenchidos */
        .codigo-preenchido {
            background-color: #eff6ff;
            border-color: #3b82f6;
        }
    </style>

</body>
</html>
