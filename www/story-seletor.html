<div class="page" data-name="indicacao">

    <input type="file" id="seletorInputFile" accept="image/*" onchange="seletorImagemSelecionada(event)">

    <video id="seletorVideo" autoplay playsinline></video>
    <canvas id="seletorCanvas"></canvas>

    <div class="seletor-gradiente-topo"></div>
    <div class="seletor-gradiente-base"></div>

    <div class="seletor-header">
        <button id="seletorBtnFechar" onclick="seletorFechar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <span class="seletor-titulo">Adicionar ao story</span>
        <button id="seletorBtnFlip" onclick="seletorFlipCamera()">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        </button>
    </div>

    <div class="seletor-hint">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        <span>Deslize para galeria</span>
    </div>

    <div class="seletor-controles">
        <button class="seletor-btn-galeria" onclick="seletorAbrirPainelGaleria()">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button class="seletor-btn-capturar" onclick="seletorCapturar()">
            <div class="seletor-btn-capturar-inner"></div>
        </button>
        <div class="seletor-controles-espaco"></div>
    </div>

    <!-- Painel de galeria -->
    <div id="seletorPainelGaleria" class="seletor-painel">
        <div class="seletor-painel-handle" onclick="seletorFecharPainelGaleria()">
            <div class="seletor-painel-handle-bar"></div>
        </div>
        <div class="seletor-painel-header">
            <span class="seletor-painel-titulo">Recentes</span>
            <button class="seletor-painel-fechar" onclick="seletorFecharPainelGaleria()">Fechar</button>
        </div>
        <div id="seletorGrade" class="seletor-grade"></div>
    </div>

</div>
