<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Suporte</title>
  <link rel="stylesheet" href="lib/framework7-bundle.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/personalizado.css">
  <link rel="stylesheet" href="css/materialdesignicons.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white !important;
    }
    body {
      font-family: 'Moranga', sans-serif;
      color: #222;
      min-height: 100vh;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
    <!-- Melhorias visuais -->
    <link rel="stylesheet" href="css/melhorias-visuais.css">
</head>
<body class="min-h-screen flex flex-col">
  <!-- App root element -->
  <div id="app">
    <div class="view view-main">
      <div class="page min-h-screen flex flex-col" data-name="suporte">
        <!-- Gradiente com tudo dentro -->
        <div class="text-white pt-12 pb-32 relative min-h-screen" style="background: var(--app-primary-color); width: 100vw; margin-left: calc(-50vw + 50%);">
          <div class="px-4">
            <div class="flex items-center justify-between mb-6">
              <div class="flex items-center">
                <span class="text-2xl font-bold">nP.</span>
              </div>
              <div class="flex items-center -space-x-1">
                <div class="w-9 h-9 bg-gray-700 rounded-full flex items-center justify-center">
                  <span class="text-sm font-semibold">nP</span>
                </div>
                <div class="w-9 h-9 bg-gray-700 rounded-full flex items-center justify-center">
                  <span class="text-sm">👋</span>
                </div>
                <div class="w-9 h-9 bg-gray-700 rounded-full flex items-center justify-center">
                  <span class="text-sm">🤘</span>
                </div>
                <button onclick="app.views.main.router.back()" class="w-8 h-8 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="text-left mb-6">
              <h1 class="text-2xl font-bold text-white">Olá, <span id="nomeUsuarioSuporte">Usuário</span><br>como posso ajudar?</h1>
            </div>
            
            <!-- Cards dentro do gradiente -->
            <div class="space-y-4">
              <!-- Ajuda e Mensagens no mesmo card -->
              <div class="bg-white rounded-2xl p-4 border border-gray-100">
                <!-- Ajuda -->
                <div class="flex items-center justify-between active-state mb-3" onclick="navegarParaAjuda()">
                  <h3 class="text-sm font-semibold text-gray-900">Ajuda</h3>
                  <div class="w-6 h-6 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600">
                      <circle cx="12" cy="12" r="10"/>
                      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                      <path d="M12 17h.01"/>
                    </svg>
                  </div>
                </div>

                <!-- Linha divisória -->
                <div class="w-full h-px bg-gray-100 mb-3"></div>

                <!-- Mensagens -->
                <div class="flex items-center justify-between active-state" onclick="navegarParaConversas()">
                  <h3 class="text-sm font-semibold text-gray-900">Mensagens</h3>
                  <div class="w-6 h-6 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Card de Prévia da Conversa Ativa (aparece apenas se houver conversa aberta) -->
              <div id="cardPreviaConversa" class="bg-white rounded-2xl p-4 border border-gray-100 hidden" onclick="navegarParaChat()">
                <div class="flex items-center mb-2">
                  <h3 class="text-sm font-semibold text-gray-900">Conversa Ativa</h3>
                  <p id="protocoloConversa" class="text-xs text-gray-400 ml-2">-</p>
                </div>
                <div class="flex items-center">
                  <div class="w-9 h-9 bg-gray-700 rounded-full mr-2 flex-shrink-0 flex items-center justify-center">
                    <span class="text-sm">👋</span>
                  </div>
                  <div class="flex-1">
                    <p id="nomeRemetente" class="text-xs text-gray-500 font-medium">-</p>
                    <p id="previaUltimaMensagem" class="text-xs text-gray-600 truncate">Carregando...</p>
                  </div>
                </div>
              </div>

              <!-- Central de Ajuda -->
              <div class="bg-white rounded-2xl p-4 border border-gray-100 flex items-center justify-between active-state" onclick="navegarParaCentralAjuda()">
                <h3 class="text-sm font-semibold text-gray-900">Central de Ajuda</h3>
                <div class="w-6 h-6 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <path d="M8 12h8"/>
                    <path d="M12 8v8"/>
                  </svg>
                </div>
              </div>

              <!-- Envie uma mensagem -->
              <div class="bg-white rounded-2xl p-4 border border-gray-100 flex items-center justify-between active-state" onclick="navegarParaNovaMensagem()">
                <h3 class="text-sm font-semibold text-gray-900">Envie uma mensagem</h3>
                <div class="w-6 h-6 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600">
                    <path d="M9 18l6-6-6-6"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script type="text/javascript" src="js/routes.js"></script>
  <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
  <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
  
  <script type="text/javascript" src="js/user-service.js"></script>
  <script src="cordova.js"></script>
  
  <script type="text/javascript" src="js/suporte.js"></script>
</body>
</html>
