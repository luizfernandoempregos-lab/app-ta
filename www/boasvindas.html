<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e40af">
    <title>Boas-vindas</title>
    <link rel="stylesheet" href="css/melhorias-visuais.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .bv-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px 120px;
            animation: mv-fade-in-up 0.6s ease-out;
        }
        .bv-illustration {
            width: 100%;
            max-width: 280px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(30, 64, 175, 0.12);
        }
        .bv-illustration img {
            width: 100%;
            height: auto;
            display: block;
        }
        .bv-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }
        .bv-subtitle {
            font-size: 15px;
            color: #6b7280;
            text-align: center;
            line-height: 1.5;
            max-width: 300px;
        }
        .bv-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            background: linear-gradient(180deg, transparent 0%, #fff 40%);
        }
        .bv-btn {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 16px 32px;
            border-radius: 14px;
            background: var(--mv-primary, #1e40af);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--mv-font);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(30, 64, 175, 0.3);
            letter-spacing: -0.01em;
        }
        .bv-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(30, 64, 175, 0.2);
        }
    </style>
</head>
<body>
    <div class="bv-container">
        <div class="bv-illustration">
            <img src="img/FACIAL.png" alt="Verificacao facial">
        </div>
        <h1 class="bv-title">Bem-vindo!</h1>
        <p class="bv-subtitle">Vamos verificar sua identidade para garantir a seguranca da sua conta</p>
    </div>
    <footer class="bv-footer">
        <button class="bv-btn" onclick="window.location.href='https://id.unico.io/auth/instrucoes-para-biometria'">Continuar</button>
    </footer>
</body>
</html>
