<div class="page" data-name="boletos">

    <!-- Imagem fullscreen -->
    <img id="storyImg" src="" alt="Story">

    <!-- Gradientes -->
    <div class="story-gradient-top"></div>
    <div class="story-gradient-bottom"></div>

    <!-- Barras de progresso -->
    <div id="storyProgressBars"></div>

    <!-- Header: avatar + nome + fechar -->
    <div id="storyHeader">
        <div>
            <img id="storyAvatarImg" src="" alt="">
            <div>
                <div id="storyUserName"></div>
                <div id="storyTimeAgo"></div>
            </div>
        </div>
        <button id="btnFechar">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <!-- Zonas de toque -->
    <div id="zonaPrev"></div>
    <div id="zonaNext"></div>

    <!-- Campo de resposta (stories de outros) -->
    <div id="storyReplyWrap">
        <input id="storyReplyInput" type="text" placeholder="Enviar mensagem..." autocomplete="off">
        <button id="storySendBtn" onclick="storyEnviar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <!-- Botão curtir -->
    <button id="storyLikeBtn" onclick="storyToggleLike()">
        <svg id="storyLikeIcon" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
    </button>

    <!-- Botão compartilhar -->
    <button id="storyShareBtn" onclick="storyShare()">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
    </button>

    <!-- Footer do próprio usuário: visualizadores + curtidas -->
    <div id="storyOwnerFooter">
        <button id="storyViewersBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span id="storyViewersCount">0</span>
        </button>
        <button id="storyOwnerLikeBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="storyOwnerLikeCount">0</span>
        </button>
    </div>

</div>
